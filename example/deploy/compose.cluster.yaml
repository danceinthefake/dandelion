# Three nodes of the same release behind a load balancer, on one machine:
# @dev-start
#   ./deploy/vendor-dandelion.sh       # dandelion checkout only: copies the library in
# @dev-end
#   docker compose -f deploy/compose.cluster.yaml up -d --build
#   ./deploy/cluster-proof.sh          # checks what the cluster promises
# http://localhost:8080 goes through nginx to any node.
#
# Local only: the secrets below are fixed and public. Real deployments take
# them from a secret store (README.md).

# Two networks: `default` (nginx, Jaeger and the nodes, which also find and talk to
# each other here) and `db` (Postgres and the nodes). Postgres is only on `db`, so
# deploy/failure-proof.sh can cut ONE node off from the database
# (`docker network disconnect`) while it stays in the cluster.
networks:
  db: {}

# @example-start
volumes:
  uploads: {}
  mailpit: {}
# @example-end

# (APP_SOURCE and APP_VERSION build and tag another version of the app: deploy/upgrade-proof.sh)
x-node: &node
  build: ${APP_SOURCE:-..}
  image: acme-node:${APP_VERSION:-1}
  networks: [default, db]
  # @example-start
  # one directory for all three nodes: a file uploaded through one is downloaded from any
  volumes: ["uploads:/data/uploads"]
  # @example-end
  depends_on:
    migrate: { condition: service_completed_successfully }
  environment: &env
    DATABASE_URL: ecto://postgres:postgres@postgres/acme
    SECRET_KEY_BASE: local-only-secret-key-base-local-only-secret-key-base-local-only-0000
    RELEASE_COOKIE: local-only-cookie-local-only-cookie
    PHX_HOST: localhost
    PAYMENT_WEBHOOK_TOKEN: local-only-webhook-token
    # The proofs make hundreds of requests from one address, so no limit is in their way
    # (reliability-proof.sh sets real ones while it checks them). To try a low one:
    # `RATE_LIMIT_AUTH=3 docker compose -f deploy/compose.cluster.yaml up -d node1 node2 node3`.
    # TRUST_FORWARDED_FOR: nginx overwrites x-forwarded-for with the address it saw, so
    # the node may count requests by it.
    SHUTDOWN_TIMEOUT_MS: "${SHUTDOWN_TIMEOUT_MS:-20000}"
    DRAIN_DELAY_MS: "${DRAIN_DELAY_MS:-5000}"
    RATE_LIMIT_API: "${RATE_LIMIT_API:-100000}"
    RATE_LIMIT_AUTH: "${RATE_LIMIT_AUTH:-100000}"
    TRUST_FORWARDED_FOR: "1"
    # @example-start
    # webhooks go to hook-receiver below, a private http address; retries come quickly
    WEBHOOK_ALLOW_HTTP: "1"
    WEBHOOK_ALLOW_PRIVATE: "1"
    WEBHOOK_BACKOFF_SECONDS: "1"
    WEBHOOK_CIRCUIT_RESET_MS: "5000"
    # @example-end
    # @example-start
    # mail goes to mailpit below (plain, no login); retries come quickly
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_TLS: never
    MAIL_BACKOFF_SECONDS: "1"
    MAIL_CIRCUIT_RESET_MS: "5000"
    # @example-end
    OBAN_RESCUE_AFTER_SECONDS: "${OBAN_RESCUE_AFTER_SECONDS:-10}"
    # traces go to Jaeger below; its UI is http://localhost:16686
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  restart: unless-stopped
  # on `docker stop` a node says "draining" for DRAIN_DELAY_MS (5 s), then finishes
  # its requests (up to SHUTDOWN_TIMEOUT_MS, 20 s) and its running jobs: allow for it
  stop_grace_period: 40s

services:
  postgres:
    image: postgres:18-alpine
    networks: [db]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acme
    healthcheck:
      test: pg_isready -U postgres
      interval: 2s
      retries: 30

  migrate:
    build: ${APP_SOURCE:-..}
    image: acme-node:${APP_VERSION:-1}
    networks: [db]
    command: /app/bin/migrate
    depends_on:
      postgres: { condition: service_healthy }
    environment: *env

  # Each node is named after its address on `default` (NODE_HOST resolves only
  # there: `hostname -i` would list the two networks' addresses in any order).
  node1:
    <<: *node
    networks:
      default: { aliases: [node1.cluster] }
      db: {}
    environment: { <<: *env, NODE_HOST: node1.cluster }
  node2:
    <<: *node
    networks:
      default: { aliases: [node2.cluster] }
      db: {}
    environment: { <<: *env, NODE_HOST: node2.cluster }
  node3:
    <<: *node
    networks:
      default: { aliases: [node3.cluster] }
      db: {}
    environment: { <<: *env, NODE_HOST: node3.cluster }

  # @example-start
  # ≈ a mail server (SES, Postmark …) that keeps what it receives, readable at
  # http://localhost:18025; deploy/email-proof.sh stops and starts it
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:18025:8025"]
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: ["mailpit:/data"]
  # @example-end

  # @example-start
  # ≈ somebody else's server, receiving our webhooks (deploy/webhook-proof.sh)
  hook-receiver:
    image: nginx:1-alpine
    volumes: ["./webhook-receiver.conf:/etc/nginx/nginx.conf:ro"]
  # @example-end

  # ≈ the monitoring system: collects /metrics from every node (prometheus.yml).
  # http://localhost:19090
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:19090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [node1, node2, node3]

  # ≈ the dashboard: http://localhost:13000 (no login to look; admin / local-only to edit).
  # grafana/dashboards/dandelion.json is loaded at start, read-only.
  grafana:
    image: grafana/grafana:12.1.0
    ports: ["127.0.0.1:13000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: local-only
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  # ≈ a tracing backend (Jaeger, Tempo, Honeycomb …): where the nodes send spans.
  # In memory, for trying things out; the UI is http://localhost:16686.
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports: ["16686:16686"]

  # ≈ the cloud load balancer
  nginx:
    image: nginx:1-alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [node1, node2, node3]
