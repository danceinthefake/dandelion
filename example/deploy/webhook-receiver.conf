# ≈ somebody else's server that receives our webhooks. It logs every request
# (id, timestamp, signature, raw body) to stdout; deploy/webhook-proof.sh reads that
# log with `docker compose logs` and checks the signatures.
events {}

http {
  log_format hook escape=none '$time_iso8601|$http_webhook_id|$http_webhook_timestamp|$http_webhook_signature|$request_body';

  server {
    listen 80;

    location /hook {
      access_log /dev/stdout hook;
      client_body_buffer_size 64k;
      # nginx only keeps the body for the log when it passes it on
      proxy_pass http://127.0.0.1:81/sink;
    }
  }

  server {
    listen 81;
    location /sink { return 200 "ok"; }
  }
}
