# ≈ the cloud load balancer: round-robin over the three nodes.
events {}

http {
  upstream acme {
    server node1:4000;
    server node2:4000;
    server node3:4000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://acme;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
