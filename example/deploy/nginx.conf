# ≈ the cloud load balancer: round-robin over the three nodes.
events {}

http {
  # WebSocket upgrades (/socket) pass through; other requests get "close"
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  upstream acme {
    server node1:4000;
    server node2:4000;
    server node3:4000;
  }

  server {
    listen 80;

    # nginx refuses a body over 1 MB by default, which would make the app's 5 MB file limit
    # unreachable: leave room for the 6 000 000 bytes the app reads of a multipart body, and let
    # the app say no (a clear message) to anything it does not want. Larger than this: nginx's 413.
    client_max_body_size 6m;

    location / {
      proxy_pass http://acme;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      # overwrite, never append: a client must not choose the address it is counted as
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_http_version 1.1;
      # stream a request body to the node as it arrives, instead of holding it until
      # complete: a slow client then occupies the node, as it would behind a balancer
      # that doesn't buffer (the reliability proofs rely on it)
      proxy_request_buffering off;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      # which node answered (the proof reads it)
      add_header X-Upstream $upstream_addr always;
    }
  }
}
